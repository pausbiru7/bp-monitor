<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BP Monitor — Pemantau Tekanan Darah</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--danger:#ef4444;--success:#22c55e;--warning:#f59e0b;--bg:#f1f5f9;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.1)}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
/* ── Login Overlay ── */
.login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;color:#fff}
.login-box{text-align:center;padding:2rem}
.login-box h1{font-size:2rem;margin-bottom:.5rem}
.login-box p{opacity:.8;margin-bottom:2rem}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:1.5rem}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.5);transition:.2s}
.pin-dot.filled{background:#fff;border-color:#fff}
.pin-dot.error{background:var(--danger);border-color:var(--danger);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center}
.pin-btn{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:1.4rem;cursor:pointer;transition:.2s}
.pin-btn:hover{background:rgba(255,255,255,.25)}
.pin-btn.fn{font-size:.9rem;border-color:transparent;background:transparent}
#loginErr{color:#fca5a5;margin-top:1rem;min-height:1.2rem;font-size:.85rem}
/* ── Header ── */
.header{background:var(--primary);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:1.1rem;display:flex;align-items:center;gap:8px}
.header-actions{display:flex;gap:8px;align-items:center}
.sync-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:600}
.sync-ok{background:rgba(34,197,94,.2);color:#bbf7d0}
.sync-err{background:rgba(239,68,68,.2);color:#fca5a5}
.sync-loading{background:rgba(255,255,255,.15);color:#fff}
.sync-local{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
.spin{display:inline-block;animation:spinning 1s linear infinite}
@keyframes spinning{to{transform:rotate(360deg)}}
/* ── Navigation ── */
.nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--border);padding:0 8px}
.nav-btn{flex:1;min-width:0;padding:10px 4px;border:none;background:none;color:var(--muted);font-size:.7rem;cursor:pointer;border-bottom:2px solid transparent;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
.nav-btn.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
/* ── Cards & Buttons ── */
.container{padding:12px;max-width:600px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h2{font-size:1rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;transition:.2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:4px 10px;font-size:.75rem;border-radius:6px}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}
/* ── Stats Grid ── */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);text-align:center}
.stat-card .num{font-size:1.6rem;font-weight:800;color:var(--primary)}
.stat-card .label{font-size:.7rem;color:var(--muted);margin-top:2px}
/* ── Table ── */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{background:#f8fafc;padding:8px;text-align:left;font-weight:600;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:hover{background:#f8fafc}
/* ── Status Badges ── */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:600}
.badge-opt{background:#dcfce7;color:#166534}.badge-nor{background:#dbeafe;color:#1e40af}
.badge-pre{background:#fef9c3;color:#854d0e}.badge-ht1{background:#fed7aa;color:#9a3412}
.badge-ht2{background:#fecaca;color:#991b1b}.badge-ht3{background:#ef4444;color:#fff}
.badge-iso{background:#e9d5ff;color:#6b21a8}
/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--card);border-radius:var(--radius);width:100%;max-width:440px;max-height:90vh;overflow-y:auto;padding:20px}
.modal h2{margin-bottom:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px;color:var(--muted)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem}
/* ── Reminder Banner ── */
.reminder-banner{background:#fffbeb;border:1px solid #fbbf24;border-radius:var(--radius);padding:12px;margin-bottom:12px}
.reminder-banner-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.reminder-banner-head h3{font-size:.85rem;color:#92400e}
.reminder-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #fde68a}
.reminder-days{padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:700}
.days-today{background:#fecaca;color:#991b1b}.days-soon{background:#fed7aa;color:#9a3412}.days-ok{background:#dcfce7;color:#166534}
/* ── Progress ── */
.trend-up{color:var(--danger)}.trend-down{color:var(--success)}.trend-same{color:var(--muted)}
/* ── Pages ── */
.page{display:none}.page.active{display:block}
/* ── Responsive ── */
@media(min-width:480px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h1>🩺 BP Monitor</h1>
    <p>Masukkan PIN 6 digit</p>
    <div class="pin-dots">
      <div class="pin-dot" id="dot0"></div><div class="pin-dot" id="dot1"></div>
      <div class="pin-dot" id="dot2"></div><div class="pin-dot" id="dot3"></div>
      <div class="pin-dot" id="dot4"></div><div class="pin-dot" id="dot5"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-btn" onclick="pinPress('1')">1</button>
      <button class="pin-btn" onclick="pinPress('2')">2</button>
      <button class="pin-btn" onclick="pinPress('3')">3</button>
      <button class="pin-btn" onclick="pinPress('4')">4</button>
      <button class="pin-btn" onclick="pinPress('5')">5</button>
      <button class="pin-btn" onclick="pinPress('6')">6</button>
      <button class="pin-btn" onclick="pinPress('7')">7</button>
      <button class="pin-btn" onclick="pinPress('8')">8</button>
      <button class="pin-btn" onclick="pinPress('9')">9</button>
      <button class="pin-btn fn" onclick="pinClear()">C</button>
      <button class="pin-btn" onclick="pinPress('0')">0</button>
      <button class="pin-btn fn" onclick="pinDelete()">⌫</button>
    </div>
    <div id="loginErr"></div>
  </div>
</div>

<!-- HEADER -->
<header class="header">
  <h1>🩺 BP Monitor</h1>
  <div class="header-actions">
    <div class="sync-badge sync-local" id="syncBadge"><span id="syncIcon">☁️</span><span id="syncText">Lokal</span></div>
    <button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff" onclick="manualSync()">🔄</button>
    <button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff" onclick="doLogout()">🚪</button>
  </div>
</header>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" onclick="showPage('dashboard')">📊<span>Dashboard</span></button>
  <button class="nav-btn" onclick="showPage('patients')">👥<span>Pasien</span></button>
  <button class="nav-btn" onclick="showPage('exams')">🩺<span>Periksa</span></button>
  <button class="nav-btn" onclick="showPage('progress')">📈<span>Progres</span></button>
  <button class="nav-btn" onclick="showPage('monthly')">📅<span>Bulanan</span></button>
  <button class="nav-btn" onclick="showPage('followups')">🔔<span>Follow-Up</span></button>
</nav>

<!-- PAGES -->
<div class="container">
  <div id="reminderBanner"></div>

  <!-- DASHBOARD -->
  <div class="page active" id="page-dashboard">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="card"><h2>📋 Pemeriksaan Terbaru</h2><div id="recentExams"></div></div>
  </div>

  <!-- PATIENTS -->
  <div class="page" id="page-patients">
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <input type="text" id="searchPatient" placeholder="🔍 Cari pasien..." style="flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem" oninput="renderPatients()">
      <select id="filterPatientKat" style="padding:8px;border:1.5px solid var(--border);border-radius:8px;font-size:.8rem" onchange="renderPatients()"></select>
      <button class="btn btn-primary" onclick="openPatientModal()">+ Pasien</button>
    </div>
    <div id="patientList"></div>
  </div>

  <!-- EXAMS -->
  <div class="page" id="page-exams">
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <input type="text" id="searchExam" placeholder="🔍 Cari..." style="flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem" oninput="renderExams()">
      <select id="filterExamKat" style="padding:8px;border:1.5px solid var(--border);border-radius:8px;font-size:.8rem" onchange="renderExams()"></select>
      <button class="btn btn-primary" onclick="openExamModal()">+ Periksa</button>
    </div>
    <div id="examList"></div>
  </div>

  <!-- PROGRESS -->
  <div class="page" id="page-progress">
    <div class="form-group">
      <select id="progressPatient" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:8px" onchange="renderProgress()">
        <option value="">Pilih Pasien</option>
      </select>
    </div>
    <div id="progressContent"></div>
  </div>

  <!-- MONTHLY -->
  <div class="page" id="page-monthly">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input type="month" id="monthlyPeriod" style="flex:1;padding:8px;border:1.5px solid var(--border);border-radius:8px" onchange="renderMonthly()">
    </div>
    <div id="monthlyContent"></div>
  </div>

  <!-- FOLLOW-UPS -->
  <div class="page" id="page-followups">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn btn-primary" onclick="openFollowupModal()">+ Follow-Up</button>
    </div>
    <div id="followupList"></div>
  </div>
</div>

<!-- MODALS PLACEHOLDER -->
<!-- MODAL: Patient -->
<div class="modal-overlay" id="patientModal">
  <div class="modal">
    <h2 id="patientModalTitle">Tambah Pasien</h2>
    <input type="hidden" id="patientEditId">
    <div class="form-group"><label>Nama Lengkap</label><input type="text" id="pName"></div>
    <div class="form-group"><label>Tanggal Lahir</label><input type="date" id="pDob"></div>
    <div class="form-group"><label>Jenis Kelamin</label><select id="pGender"><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></div>
    <div class="form-group"><label>No. HP (WhatsApp)</label><input type="tel" id="pPhone" placeholder="628xxxxxxxxxx"></div>
    <div class="form-group"><label>Alamat</label><textarea id="pAddress" rows="2"></textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="closeModal('patientModal')">Batal</button>
      <button class="btn btn-primary" onclick="savePatient()">Simpan</button>
    </div>
  </div>
</div>

<!-- MODAL: Exam -->
<div class="modal-overlay" id="examModal">
  <div class="modal">
    <h2 id="examModalTitle">Tambah Pemeriksaan</h2>
    <input type="hidden" id="examEditId">
    <div class="form-group"><label>Pasien</label><select id="ePatient"></select></div>
    <div class="form-group"><label>Tanggal Periksa</label><input type="date" id="eDate"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="form-group"><label>Sistolik (mmHg)</label><input type="number" id="eSystolic" min="60" max="300"></div>
      <div class="form-group"><label>Diastolik (mmHg)</label><input type="number" id="eDiastolic" min="30" max="200"></div>
    </div>
    <div class="form-group"><label>Nadi (bpm)</label><input type="number" id="ePulse" min="30" max="250"></div>
    <div class="form-group"><label>Catatan</label><textarea id="eNotes" rows="2"></textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="closeModal('examModal')">Batal</button>
      <button class="btn btn-primary" onclick="saveExam()">Simpan</button>
    </div>
  </div>
</div>

<!-- MODAL: Follow-Up -->
<div class="modal-overlay" id="followupModal">
  <div class="modal">
    <h2>Tambah Follow-Up</h2>
    <div class="form-group"><label>Pasien</label><select id="fPatient"></select></div>
    <div class="form-group"><label>Tanggal Kontrol</label><input type="date" id="fDueDate"></div>
    <div class="form-group"><label>Alasan</label><input type="text" id="fReason" placeholder="Kontrol rutin / evaluasi obat"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="closeModal('followupModal')">Batal</button>
      <button class="btn btn-primary" onclick="saveFollowup()">Simpan</button>
    </div>
  </div>
</div>

<!-- MODAL: Change PIN -->
<div class="modal-overlay" id="changePinModal">
  <div class="modal">
    <h2>🔐 Ganti PIN</h2>
    <div class="form-group"><label>PIN Lama</label><input type="password" id="oldPin" maxlength="6"></div>
    <div class="form-group"><label>PIN Baru</label><input type="password" id="newPin" maxlength="6"></div>
    <div class="form-group"><label>Konfirmasi PIN Baru</label><input type="password" id="confirmPin" maxlength="6"></div>
    <div id="changePinErr" style="color:var(--danger);font-size:.8rem;min-height:1rem;margin-bottom:8px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="closeModal('changePinModal')">Batal</button>
      <button class="btn btn-primary" onclick="doChangePin()">Simpan</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// ☁️ GOOGLE SHEET CONFIG
// ══════════════════════════════════════════
const SCRIPT_URL = 'https://docs.google.com/spreadsheets/d/15h5nRAAwPI1KN13c1D-fTSttxBNw0aDIXUc0xHIeb7E/edit?usp=drive_link';

function syncToSheet(payload){
  return fetch(SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  }).then(r => r.json());
}

// ══════════════════════════════════════════
// 📦 DATA LAYER
// ══════════════════════════════════════════
let patients  = JSON.parse(localStorage.getItem('bpm_patients')  || '[]');
let exams     = JSON.parse(localStorage.getItem('bpm_exams')     || '[]');
let followups = JSON.parse(localStorage.getItem('bpm_followups') || '[]');
let nextPid = patients.length ? Math.max(...patients.map(p=>+p.id))+1 : 1;
let nextEid = exams.length    ? Math.max(...exams.map(e=>+e.id))+1    : 1;
let nextFid = followups.length? Math.max(...followups.map(f=>+f.id))+1: 1;

// ══════════════════════════════════════════
// 🛠️ HELPERS
// ══════════════════════════════════════════
function fmt(d){if(!d)return'-';const dt=new Date(d);return dt.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
function calcAge(dob){if(!dob)return'-';const b=new Date(dob),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;return a}
function getStatus(s,d){
  if(s>=180||d>=110)return{key:'ht3',label:'Hipertensi Derajat 3',color:'#ef4444'};
  if(s>=160||d>=100)return{key:'ht2',label:'Hipertensi Derajat 2',color:'#f97316'};
  if(s>=140||d>=90)return{key:'ht1',label:'Hipertensi Derajat 1',color:'#fb923c'};
  if(s>=130&&s<=139&&d<90)return{key:'pre',label:'Normal-Tinggi',color:'#eab308'};
  if(s>=140&&d<90)return{key:'iso',label:'HT Sistolik Terisolasi',color:'#a855f7'};
  if(s>=120&&s<=129&&d>=80&&d<=84)return{key:'nor',label:'Normal',color:'#3b82f6'};
  if(s<120&&d<80)return{key:'opt',label:'Optimal',color:'#22c55e'};
  return{key:'nor',label:'Normal',color:'#3b82f6'};
}
function lastExam(pid){const pe=exams.filter(e=>+e.patientId===+pid).sort((a,b)=>a.examDate.localeCompare(b.examDate));return pe.length?pe[pe.length-1]:null}
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{b.classList.toggle('active',b.textContent.toLowerCase().includes(name.substring(0,4)))});
  if(name==='dashboard'){renderStats();renderDashboard()}
  if(name==='patients')renderPatients();
  if(name==='exams')renderExams();
  if(name==='progress')populateProgressSelect();
  if(name==='monthly')renderMonthly();
  if(name==='followups')renderFollowups();
}
function closeModal(id){document.getElementById(id).style.display='none'}
function openModal(id){document.getElementById(id).style.display='flex'}

// ══════════════════════════════════════════
// 📊 RENDERING
// ══════════════════════════════════════════
function renderStats(){
  const total=patients.length;const thisMonth=exams.filter(e=>e.examDate&&e.examDate.startsWith(new Date().toISOString().slice(0,7))).length;
  const cats={opt:0,nor:0,pre:0,ht1:0,ht2:0,ht3:0,iso:0};
  patients.forEach(p=>{const le=lastExam(p.id);if(le){const st=getStatus(+le.systolic,+le.diastolic);cats[st.key]=(cats[st.key]||0)+1}});
  const htTotal=cats.ht1+cats.ht2+cats.ht3+cats.iso;
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-card"><div class="num">${total}</div><div class="label">Total Pasien</div></div>
    <div class="stat-card"><div class="num">${thisMonth}</div><div class="label">Periksa Bulan Ini</div></div>
    <div class="stat-card"><div class="num" style="color:var(--danger)">${htTotal}</div><div class="label">Hipertensi</div></div>
    <div class="stat-card"><div class="num" style="color:var(--success)">${cats.opt+cats.nor}</div><div class="label">Normal/Optimal</div></div>`;
}
function renderDashboard(){
  const recent=exams.slice().sort((a,b)=>b.examDate.localeCompare(a.examDate)).slice(0,8);
  let h='<div class="table-wrap"><table><tr><th>Tgl</th><th>Pasien</th><th>TD</th><th>Status</th></tr>';
  recent.forEach(e=>{const p=patients.find(x=>+x.id===+e.patientId);const st=getStatus(+e.systolic,+e.diastolic);
    h+=`<tr><td>${fmt(e.examDate)}</td><td>${p?p.name:'?'}</td><td>${e.systolic}/${e.diastolic}</td><td><span class="badge badge-${st.key}">${st.label}</span></td></tr>`});
  h+='</table></div>';document.getElementById('recentExams').innerHTML=h;
}
function renderPatients(){
  const q=(document.getElementById('searchPatient').value||'').toLowerCase();
  const kat=document.getElementById('filterPatientKat').value;
  let list=patients.filter(p=>{
    if(q&&!p.name.toLowerCase().includes(q))return false;
    if(kat){const le=lastExam(p.id);if(!le)return false;const st=getStatus(+le.systolic,+le.diastolic);if(st.key!==kat)return false}
    return true;
  });
  let h='<div class="table-wrap"><table><tr><th>Nama</th><th>Umur</th><th>TD Terakhir</th><th>Status</th><th>Aksi</th></tr>';
  list.forEach(p=>{const le=lastExam(p.id);const st=le?getStatus(+le.systolic,+le.diastolic):{key:'nor',label:'-'};
    h+=`<tr><td>${p.name}</td><td>${calcAge(p.dob)}</td><td>${le?le.systolic+'/'+le.diastolic:'-'}</td><td><span class="badge badge-${st.key}">${st.label}</span></td>
    <td><button class="btn btn-sm btn-outline" onclick="editPatient(${p.id})">✏️</button> <button class="btn btn-sm btn-danger" onclick="delPatient(${p.id})">🗑️</button></td></tr>`});
  h+='</table></div>';document.getElementById('patientList').innerHTML=list.length?h:'<p style="text-align:center;color:var(--muted);padding:2rem">Belum ada data pasien.</p>';
}
function renderExams(){
  const q=(document.getElementById('searchExam').value||'').toLowerCase();
  const kat=document.getElementById('filterExamKat').value;
  let list=exams.filter(e=>{
    const p=patients.find(x=>+x.id===+e.patientId);
    if(q&&!(p&&p.name.toLowerCase().includes(q))&&!e.examDate.includes(q))return false;
    if(kat){const st=getStatus(+e.systolic,+e.diastolic);if(st.key!==kat)return false}
    return true;
  }).sort((a,b)=>b.examDate.localeCompare(a.examDate));
  let h='<div class="table-wrap"><table><tr><th>Tgl</th><th>Pasien</th><th>TD</th><th>Nadi</th><th>Status</th><th>Aksi</th></tr>';
  list.forEach(e=>{const p=patients.find(x=>+x.id===+e.patientId);const st=getStatus(+e.systolic,+e.diastolic);
    h+=`<tr><td>${fmt(e.examDate)}</td><td>${p?p.name:'?'}</td><td>${e.systolic}/${e.diastolic}</td><td>${e.pulse||'-'}</td><td><span class="badge badge-${st.key}">${st.label}</span></td>
    <td><button class="btn btn-sm btn-outline" onclick="editExam(${e.id})">✏️</button> <button class="btn btn-sm btn-danger" onclick="delExam(${e.id})">🗑️</button></td></tr>`});
  h+='</table></div>';document.getElementById('examList').innerHTML=list.length?h:'<p style="text-align:center;color:var(--muted);padding:2rem">Belum ada data pemeriksaan.</p>';
}
function openPatientModal(id){
  document.getElementById('patientEditId').value='';document.getElementById('pName').value='';
  document.getElementById('pDob').value='';document.getElementById('pGender').value='L';
  document.getElementById('pPhone').value='';document.getElementById('pAddress').value='';
  document.getElementById('patientModalTitle').textContent='Tambah Pasien';
  openModal('patientModal');
}
function editPatient(id){const p=patients.find(x=>+x.id===+id);if(!p)return;
  document.getElementById('patientEditId').value=id;document.getElementById('pName').value=p.name;
  document.getElementById('pDob').value=p.dob||'';document.getElementById('pGender').value=p.gender||'L';
  document.getElementById('pPhone').value=p.phone||'';document.getElementById('pAddress').value=p.address||'';
  document.getElementById('patientModalTitle').textContent='Edit Pasien';openModal('patientModal');
}
function savePatient(){
  const eid=document.getElementById('patientEditId').value;const name=document.getElementById('pName').value.trim();
  if(!name){alert('Nama wajib diisi');return}
  const obj={name,dob:document.getElementById('pDob').value,gender:document.getElementById('pGender').value,phone:document.getElementById('pPhone').value.trim(),address:document.getElementById('pAddress').value.trim()};
  if(eid){const idx=patients.findIndex(p=>+p.id===+eid);if(idx>=0)patients[idx]={...patients[idx],...obj}}
  else{obj.id=nextPid++;patients.push(obj)}
  save();closeModal('patientModal');renderPatients();
}
function delPatient(id){if(!confirm('Hapus pasien ini?'))return;patients=patients.filter(p=>+p.id!==+id);exams=exams.filter(e=>+e.patientId!==+id);followups=followups.filter(f=>+f.patientId!==+id);save();renderPatients();}
function openExamModal(){
  document.getElementById('examEditId').value='';document.getElementById('eSystolic').value='';
  document.getElementById('eDiastolic').value='';document.getElementById('ePulse').value='';
  document.getElementById('eNotes').value='';document.getElementById('eDate').value=new Date().toISOString().slice(0,10);
  document.getElementById('examModalTitle').textContent='Tambah Pemeriksaan';
  const sel=document.getElementById('ePatient');sel.innerHTML=patients.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  openModal('examModal');
}
function editExam(id){const e=exams.find(x=>+x.id===+id);if(!e)return;
  document.getElementById('examEditId').value=id;
  const sel=document.getElementById('ePatient');sel.innerHTML=patients.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  sel.value=e.patientId;document.getElementById('eDate').value=e.examDate;
  document.getElementById('eSystolic').value=e.systolic;document.getElementById('eDiastolic').value=e.diastolic;
  document.getElementById('ePulse').value=e.pulse||'';document.getElementById('eNotes').value=e.notes||'';
  document.getElementById('examModalTitle').textContent='Edit Pemeriksaan';openModal('examModal');
}
function saveExam(){
  const eid=document.getElementById('examEditId').value;const pid=document.getElementById('ePatient').value;
  const s=+document.getElementById('eSystolic').value,d=+document.getElementById('eDiastolic').value;
  if(!pid||!s||!d){alert('Pasien, sistolik & diastolik wajib');return}
  const obj={patientId:+pid,examDate:document.getElementById('eDate').value,systolic:s,diastolic:d,pulse:document.getElementById('ePulse').value,notes:document.getElementById('eNotes').value.trim()};
  if(eid){const idx=exams.findIndex(e=>+e.id===+eid);if(idx>=0)exams[idx]={...exams[idx],...obj}}
  else{obj.id=nextEid++;exams.push(obj)}
  save();closeModal('examModal');renderExams();renderStats();renderDashboard();
}
function delExam(id){if(!confirm('Hapus pemeriksaan ini?'))return;exams=exams.filter(e=>+e.id!==+id);save();renderExams();}
function populateFilterOptions(){
  const opts='<option value="">Semua</option><option value="opt">Optimal</option><option value="nor">Normal</option><option value="pre">Normal-Tinggi</option><option value="ht1">HT 1</option><option value="ht2">HT 2</option><option value="ht3">HT 3</option><option value="iso">Isolated</option>';
  document.getElementById('filterPatientKat').innerHTML=opts;document.getElementById('filterExamKat').innerHTML=opts;
}

// ══════════════════════════════════════════
// 📈 PROGRESS & CHARTS
// ══════════════════════════════════════════
let progressChart=null;
function populateProgressSelect(){
  const sel=document.getElementById('progressPatient');
  sel.innerHTML='<option value="">Pilih Pasien</option>'+patients.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
}
function renderProgress(){
  const pid=document.getElementById('progressPatient').value;
  const c=document.getElementById('progressContent');
  if(!pid){c.innerHTML='<p style="text-align:center;color:var(--muted);padding:2rem">Pilih pasien untuk melihat progres.</p>';return}
  const pe=exams.filter(e=>+e.patientId===+pid).sort((a,b)=>a.examDate.localeCompare(b.examDate));
  if(!pe.length){c.innerHTML='<p style="text-align:center;color:var(--muted);padding:2rem">Belum ada data pemeriksaan.</p>';return}
  const p=patients.find(x=>+x.id===+pid);
  const last=pe[pe.length-1],prev=pe.length>1?pe[pe.length-2]:null;
  const st=getStatus(+last.systolic,+last.diastolic);
  let trendS='→',trendD='→',trendClass='trend-same';
  if(prev){
    if(+last.systolic>+prev.systolic){trendS='↑';trendClass='trend-up'}
    else if(+last.systolic<+prev.systolic){trendS='↓';trendClass='trend-down'}
    if(+last.diastolic>+prev.diastolic)trendD='↑';else if(+last.diastolic<+prev.diastolic)trendD='↓';
  }
  const avgS=Math.round(pe.reduce((a,e)=>a+(+e.systolic),0)/pe.length);
  const avgD=Math.round(pe.reduce((a,e)=>a+(+e.diastolic),0)/pe.length);
  let rec=getRecommendation(st.key);
  c.innerHTML=`
    <div class="card"><h2>👤 ${p.name}</h2>
      <p>Usia: ${calcAge(p.dob)} thn | ${pe.length} pemeriksaan</p>
      <p>Terakhir: <b>${last.systolic}/${last.diastolic}</b> mmHg <span class="${trendClass}">${trendS}${trendD}</span> — <span class="badge badge-${st.key}">${st.label}</span></p>
      <p>Rata-rata: ${avgS}/${avgD} mmHg</p>
    </div>
    <div class="card"><h2>📈 Grafik Tekanan Darah</h2><canvas id="bpChart" height="200"></canvas></div>
    <div class="card"><h2>💡 Rekomendasi</h2><p style="font-size:.85rem;line-height:1.6">${rec}</p>
      <button class="btn btn-sm" style="background:#25d366;color:#fff;margin-top:8px" onclick="sendWA(${pid})">📲 Kirim via WhatsApp</button>
    </div>`;
  const ctx=document.getElementById('bpChart').getContext('2d');
  if(progressChart)progressChart.destroy();
  progressChart=new Chart(ctx,{type:'line',data:{labels:pe.map(e=>fmt(e.examDate)),
    datasets:[{label:'Sistolik',data:pe.map(e=>+e.systolic),borderColor:'#ef4444',backgroundColor:'rgba(239,68,68,.1)',fill:true,tension:.3},
    {label:'Diastolik',data:pe.map(e=>+e.diastolic),borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,.1)',fill:true,tension:.3}]},
    options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{min:40,max:220,ticks:{stepSize:20}}}}});
}
function getRecommendation(key){
  const recs={opt:'Tekanan darah optimal! Pertahankan pola hidup sehat: olahraga teratur, diet rendah garam, dan istirahat cukup.',
    nor:'Tekanan darah normal. Lanjutkan gaya hidup sehat dan kontrol rutin setiap 6 bulan.',
    pre:'Normal-Tinggi: Risiko meningkat. Kurangi garam (<5g/hari), tingkatkan aktivitas fisik 30 menit/hari, dan kelola stres. Kontrol 3 bulan.',
    ht1:'Hipertensi Derajat 1: Perlu modifikasi gaya hidup intensif. Diet DASH, olahraga aerobik 150 mnt/minggu. Konsultasi dokter untuk evaluasi obat. Kontrol 1 bulan.',
    ht2:'Hipertensi Derajat 2: Perlu terapi obat segera + modifikasi gaya hidup. Konsultasi dokter SpJP. Pantau TD harian. Kontrol 2 minggu.',
    ht3:'⚠️ HIPERTENSI DARURAT: Segera rujuk ke IGD/RS! Risiko stroke, serangan jantung, kerusakan organ. Jangan tunda penanganan medis.',
    iso:'HT Sistolik Terisolasi: Sering pada lansia. Konsultasi dokter untuk evaluasi risiko kardiovaskular dan kemungkinan terapi.'};
  return recs[key]||recs.nor;
}

// ══════════════════════════════════════════
// 📅 MONTHLY REPORT
// ══════════════════════════════════════════
function renderMonthly(){
  const period=document.getElementById('monthlyPeriod').value||new Date().toISOString().slice(0,7);
  document.getElementById('monthlyPeriod').value=period;
  const me=exams.filter(e=>e.examDate&&e.examDate.startsWith(period));
  const c=document.getElementById('monthlyContent');
  if(!me.length){c.innerHTML='<p style="text-align:center;color:var(--muted);padding:2rem">Tidak ada data untuk periode ini.</p>';return}
  const cats={opt:0,nor:0,pre:0,ht1:0,ht2:0,ht3:0,iso:0};
  me.forEach(e=>{const st=getStatus(+e.systolic,+e.diastolic);cats[st.key]=(cats[st.key]||0)+1});
  const uniqueP=new Set(me.map(e=>e.patientId)).size;
  const avgS=Math.round(me.reduce((a,e)=>a+(+e.systolic),0)/me.length);
  const avgD=Math.round(me.reduce((a,e)=>a+(+e.diastolic),0)/me.length);
  c.innerHTML=`
    <div class="card"><h2>📊 Ringkasan ${period}</h2>
      <div class="stats-grid">
        <div class="stat-card"><div class="num">${me.length}</div><div class="label">Pemeriksaan</div></div>
        <div class="stat-card"><div class="num">${uniqueP}</div><div class="label">Pasien Diperiksa</div></div>
        <div class="stat-card"><div class="num">${avgS}/${avgD}</div><div class="label">Rata-rata TD</div></div>
        <div class="stat-card"><div class="num" style="color:var(--danger)">${cats.ht1+cats.ht2+cats.ht3+cats.iso}</div><div class="label">Kasus HT</div></div>
      </div>
    </div>
    <div class="card"><h2>📋 Distribusi Kategori</h2><canvas id="monthlyChart" height="200"></canvas></div>
    <div class="card"><h2>📝 Detail Pemeriksaan</h2>
      <div class="table-wrap"><table><tr><th>Tgl</th><th>Pasien</th><th>TD</th><th>Status</th></tr>
      ${me.sort((a,b)=>a.examDate.localeCompare(b.examDate)).map(e=>{const p=patients.find(x=>+x.id===+e.patientId);const st=getStatus(+e.systolic,+e.diastolic);
        return`<tr><td>${fmt(e.examDate)}</td><td>${p?p.name:'?'}</td><td>${e.systolic}/${e.diastolic}</td><td><span class="badge badge-${st.key}">${st.label}</span></td></tr>`}).join('')}
      </table></div>
    </div>`;
  const ctx2=document.getElementById('monthlyChart').getContext('2d');
  new Chart(ctx2,{type:'doughnut',data:{labels:['Optimal','Normal','Normal-Tinggi','HT 1','HT 2','HT 3','Isolated'],
    datasets:[{data:[cats.opt,cats.nor,cats.pre,cats.ht1,cats.ht2,cats.ht3,cats.iso],backgroundColor:['#22c55e','#3b82f6','#eab308','#fb923c','#f97316','#ef4444','#a855f7']}]},
    options:{responsive:true,plugins:{legend:{position:'bottom'}}}});
}

// ══════════════════════════════════════════
// 🔔 FOLLOW-UPS
// ══════════════════════════════════════════
function renderFollowups(){
  const sorted=followups.slice().sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const c=document.getElementById('followupList');
  if(!sorted.length){c.innerHTML='<p style="text-align:center;color:var(--muted);padding:2rem">Belum ada jadwal follow-up.</p>';return}
  let h='<div class="table-wrap"><table><tr><th>Tgl Kontrol</th><th>Pasien</th><th>Alasan</th><th>Status</th><th>Aksi</th></tr>';
  sorted.forEach(f=>{const p=patients.find(x=>+x.id===+f.patientId);
    const diff=Math.ceil((new Date(f.dueDate)-new Date())/(864e5));
    let sClass='days-ok',sLabel=diff+' hari';
    if(diff<=0){sClass='days-today';sLabel=diff===0?'Hari Ini':'Terlambat '+(-diff)+' hari'}
    else if(diff<=3){sClass='days-soon';sLabel=diff+' hari lagi'}
    h+=`<tr><td>${fmt(f.dueDate)}</td><td>${p?p.name:'?'}</td><td>${f.reason||'-'}</td>
    <td><span class="reminder-days ${sClass}">${sLabel}</span></td>
    <td><button class="btn btn-sm btn-outline" onclick="completeFollowup(${f.id})">✅</button> <button class="btn btn-sm btn-danger" onclick="delFollowup(${f.id})">🗑️</button></td></tr>`});
  h+='</table></div>';c.innerHTML=h;
}
function openFollowupModal(){
  document.getElementById('fDueDate').value='';document.getElementById('fReason').value='';
  const sel=document.getElementById('fPatient');sel.innerHTML=patients.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  openModal('followupModal');
}
function saveFollowup(){
  const pid=document.getElementById('fPatient').value;const due=document.getElementById('fDueDate').value;
  if(!pid||!due){alert('Pasien dan tanggal wajib');return}
  followups.push({id:nextFid++,patientId:+pid,dueDate:due,reason:document.getElementById('fReason').value.trim()});
  save();closeModal('followupModal');renderFollowups();renderReminders();
}
function completeFollowup(id){followups=followups.filter(f=>+f.id!==+id);save();renderFollowups();renderReminders()}
function delFollowup(id){if(!confirm('Hapus follow-up ini?'))return;completeFollowup(id)}

// ══════════════════════════════════════════
// 📲 WHATSAPP & REKOMENDASI
// ══════════════════════════════════════════
function sendWA(pid){
  const p=patients.find(x=>+x.id===+pid);if(!p)return;
  const le=lastExam(pid);if(!le){alert('Belum ada data pemeriksaan');return}
  const st=getStatus(+le.systolic,+le.diastolic);const rec=getRecommendation(st.key);
  const msg=`🩺 *HASIL PEMERIKSAAN TEKANAN DARAH*\n\n👤 Nama: ${p.name}\n📅 Tanggal: ${fmt(le.examDate)}\n\n📊 Tekanan Darah: *${le.systolic}/${le.diastolic} mmHg*\n❤️ Nadi: ${le.pulse||'-'} bpm\n📋 Kategori: *${st.label}*\n\n💡 *Rekomendasi:*\n${rec}\n\n_Pesan otomatis dari BP Monitor_`;
  const phone=p.phone||'';const url=`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
  window.open(url,'_blank');
}

// ══════════════════════════════════════════
// 🔐 LOGIN PIN
// ══════════════════════════════════════════
let pin='';const DEFAULT_PIN='123456';
function getPin(){return localStorage.getItem('bpm_pin')||DEFAULT_PIN}
function pinPress(n){if(pin.length>=6)return;pin+=n;updateDots();
  if(pin.length===6){if(pin===getPin()){document.getElementById('loginOverlay').style.display='none';initApp()}
    else{document.querySelectorAll('.pin-dot').forEach(d=>{d.classList.add('error')});
      document.getElementById('loginErr').textContent='PIN salah!';setTimeout(()=>{pin='';updateDots();document.getElementById('loginErr').textContent='';
      document.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('error'))},800)}}}
function pinClear(){pin='';updateDots()}
function pinDelete(){pin=pin.slice(0,-1);updateDots()}
function updateDots(){for(let i=0;i<6;i++){document.getElementById('dot'+i).classList.toggle('filled',i<pin.length)}}
function doLogout(){document.getElementById('loginOverlay').style.display='flex';pin='';updateDots()}
function doChangePin(){
  const old=document.getElementById('oldPin').value,nw=document.getElementById('newPin').value,cf=document.getElementById('confirmPin').value;
  const err=document.getElementById('changePinErr');
  if(old!==getPin()){err.textContent='PIN lama salah';return}
  if(nw.length!==6){err.textContent='PIN baru harus 6 digit';return}
  if(nw!==cf){err.textContent='Konfirmasi tidak cocok';return}
  localStorage.setItem('bpm_pin',nw);err.textContent='';closeModal('changePinModal');alert('PIN berhasil diubah!');
}

// ══════════════════════════════════════════
// 🔔 REMINDER BANNER
// ══════════════════════════════════════════
function renderReminders(){
  const upcoming=followups.filter(f=>{const diff=Math.ceil((new Date(f.dueDate)-new Date())/(864e5));return diff<=7}).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const el=document.getElementById('reminderBanner');
  if(!upcoming.length){el.innerHTML='';return}
  let h='<div class="reminder-banner"><div class="reminder-banner-head"><h3>🔔 Pengingat Follow-Up</h3><span>'+upcoming.length+' jadwal</span></div>';
  upcoming.forEach(f=>{const p=patients.find(x=>+x.id===+f.patientId);
    const diff=Math.ceil((new Date(f.dueDate)-new Date())/(864e5));
    let cls='days-ok',lbl=diff+' hari';
    if(diff<=0){cls='days-today';lbl=diff===0?'Hari Ini':'Terlambat'}else if(diff<=3){cls='days-soon';lbl=diff+' hari'}
    h+=`<div class="reminder-item"><span>${p?p.name:'?'} — ${f.reason||'Kontrol'}</span><span class="reminder-days ${cls}">${lbl}</span></div>`});
  h+='</div>';el.innerHTML=h;
}

// ══════════════════════════════════════════
// 🔍 SEARCH & FILTER
// ══════════════════════════════════════════
// Search & filter handled inline in renderPatients/renderExams

// ══════════════════════════════════════════
// ⚙️ SYNC & CONFIG
// ══════════════════════════════════════════
function save(){
  localStorage.setItem('bpm_patients',JSON.stringify(patients));
  localStorage.setItem('bpm_exams',JSON.stringify(exams));
  localStorage.setItem('bpm_followups',JSON.stringify(followups));
}
function manualSync(){
  const badge=document.getElementById('syncBadge');const icon=document.getElementById('syncIcon');const text=document.getElementById('syncText');
  badge.className='sync-badge sync-loading';icon.innerHTML='<span class="spin">⟳</span>';text.textContent='Menyimpan...';
  save();
  syncToSheet({patients, exams, followups})
    .then(()=>{
      badge.className='sync-badge sync-ok';icon.textContent='✅';text.textContent='Tersimpan';
      setTimeout(()=>{badge.className='sync-badge sync-local';icon.textContent='☁️';text.textContent='Lokal'},2000);
    })
    .catch(()=>{
      badge.className='sync-badge sync-err';icon.textContent='❌';text.textContent='Gagal';
      setTimeout(()=>{badge.className='sync-badge sync-local';icon.textContent='☁️';text.textContent='Lokal'},3000);
    });
}
function initApp(){
  populateFilterOptions();renderStats();renderDashboard();renderReminders();
}
// Auto-init: if no PIN set yet, skip login
if(!localStorage.getItem('bpm_pin')&&!localStorage.getItem('bpm_patients')){
  document.getElementById('loginOverlay').style.display='none';initApp();
}
</script>
